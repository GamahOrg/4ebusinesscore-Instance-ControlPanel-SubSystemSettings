name: Docker Image CI

on:
  push:
    branches: [ "4E-Publish" ]
  pull_request:
    branches: [ "4E-Publish" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4



    - name: Build the Docker image
      run: docker build Workspace --file Workspace/Dockerfile --tag 4epublish/4ebusinesscore-controlpanal-subsystemsettings:latest

    - name: Push image to Docker Hub
      run: |
          docker login -u 4epublish -p ${{ secrets.DOCKER_HUB_TOKEN }}
          docker push 4epublish/4ebusinesscore-controlpanal-subsystemsettings:latest
